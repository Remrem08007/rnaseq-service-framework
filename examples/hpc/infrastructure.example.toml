[cluster]
account = "PROJECT_ACCOUNT"
partition = "COMPUTE_PARTITION"
job_name = "rnaseq-service"
launcher_cpus = 2
launcher_memory_gb = 8
launcher_time = "12:00:00"
max_task_cpus = 32
max_task_memory_gb = 128
max_task_time_hours = 24
queue_size = 100
per_cpu_memory = false

[paths]
work_root = "/shared/project/work"
container_cache = "/shared/project/containers"
reference_cache = "/shared/project/references/igenomes"

[software]
purge_modules = true
modules = ["StdEnv/2023", "nextflow/25.10.2", "apptainer/1.3.5"]
