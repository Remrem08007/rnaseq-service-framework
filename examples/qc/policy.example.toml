schema_version = 1

[study]
# Metric-profile outliers are review signals, never automatic exclusions.
robust_z_threshold = 4.5
min_samples_for_outliers = 4

[[metrics]]
id = "uniquely_mapped_percent"
kind = "numeric"
source_file = "multiqc_general_stats.txt"
sample_column = "Sample"
value_column = "STAR_mqc-generalstats-star-uniquely_mapped_percent"
required = true
lower = 70.0
upper = 100.0
outlier = true

[[metrics]]
id = "duplication_fraction"
kind = "numeric"
source_file = "multiqc_general_stats.txt"
sample_column = "Sample"
value_column = "Picard_mqc-generalstats-picard-PERCENT_DUPLICATION"
required = true
lower = 0.0
upper = 0.8
outlier = true

