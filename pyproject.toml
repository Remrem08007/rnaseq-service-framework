[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rnaseq-service-framework"
version = "0.1.0.dev0"
description = "Client-delivery validation and orchestration for reproducible RNA-seq analysis"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  {name = "Rémi-Antoine Joron"},
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[project.scripts]
rnaseq-service-preflight = "rnaseq_service.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
